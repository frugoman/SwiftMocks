# Builds, tests, lints, and documents SwiftMocks.
# See: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-swift

name: Build and Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  macos:
    name: macOS (Xcode ${{ matrix.xcode }})
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        xcode: ["16.2"]
    env:
      DEVELOPER_DIR: /Applications/Xcode_${{ matrix.xcode }}.app/Contents/Developer
    steps:
    - uses: actions/checkout@v4
    - name: Swift version
      run: swift --version
    - name: Build
      run: swift build -v
    - name: Run tests (with coverage)
      run: swift test -v --enable-code-coverage
    - name: Coverage summary
      run: |
        BIN=$(swift build --show-bin-path)
        XCTEST=$(find "$BIN" -name '*PackageTests.xctest' -maxdepth 1 | head -1)
        PROF="$BIN/codecov/default.profdata"
        if [ -n "$XCTEST" ] && [ -f "$PROF" ]; then
          # Macro code runs at compile time in the plugin process, so the test binary's
          # runtime coverage can't observe it — exclude it to keep the number meaningful.
          xcrun llvm-cov report "$XCTEST/Contents/MacOS/$(basename "$XCTEST" .xctest)" \
            -instr-profile "$PROF" \
            -ignore-filename-regex='\.build|Tests|SwiftMocksClient|SwiftMocksMacros' || true
        fi

  linux:
    name: Linux (Swift ${{ matrix.swift }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        swift: ["6.0", "6.1"]
    container:
      image: swift:${{ matrix.swift }}
    steps:
    - uses: actions/checkout@v4
    - name: Swift version
      run: swift --version
    - name: Build
      run: swift build -v
    - name: Run tests
      run: swift test -v

  lint:
    name: SwiftLint
    runs-on: macos-15
    steps:
    - uses: actions/checkout@v4
    - name: Lint
      run: |
        which swiftlint || brew install swiftlint
        swiftlint lint --quiet

  docs:
    name: Build documentation
    runs-on: macos-15
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.2.app/Contents/Developer
      SWIFTMOCKS_BUILD_DOCS: "1"
    steps:
    - uses: actions/checkout@v4
    - name: Generate DocC archive
      run: |
        swift package --allow-writing-to-directory ./docs-build \
          generate-documentation --target SwiftMocks --output-path ./docs-build
